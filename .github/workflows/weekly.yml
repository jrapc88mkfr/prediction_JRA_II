# .github/workflows/weekly.yml
#
# 毎週土曜 7:30 JST (UTC 前日22:30) に自動実行
# schedule.json の active:true のレースを全て処理する
#
# 【GitHub Secrets に登録が必要なもの】
#   ANTHROPIC_API_KEY ... Claude API キー
#   GH_TOKEN          ... Personal Access Token (repo スコープ)

name: 競馬予想データ自動生成

on:
  schedule:
    - cron: "30 22 * * 5"   # 毎週土曜 7:30 JST（金曜UTC22:30）
  workflow_dispatch:          # 手動実行ボタン（テスト用）
    inputs:
      race_name:
        description: "手動指定レース名（空白=schedule.jsonに従う）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # 2. Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 依存ライブラリをインストール
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 anthropic python-dotenv

      # 4. schedule.json から active なレースを取得してスクリプト実行
      - name: Run JRA_read_next.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_RACE: ${{ github.event.inputs.race_name }}
        run: |
          python run_schedule.py

      # 5. 生成した JSON と schedule.json をコミット・プッシュ
      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add DATA/ schedule.json
          git diff --cached --quiet || git commit -m "🏇 $(date '+%Y/%m/%d') 競馬予想データ更新"
          git push
