# .github/workflows/update_odds.yml
#
# オッズ更新ワークフロー（API使用なし・無料）
#
# 実行タイミング（JST）:
#   土曜  8:00 → cron: "0 23 * * 5"  (金曜UTC23時)
#   土曜 12:00 → cron: "0  3 * * 6"  (土曜UTC3時)
#   土曜 17:00 → cron: "0  8 * * 6"  (土曜UTC8時)
#   日曜  8:00 → cron: "0 23 * * 6"  (土曜UTC23時)
#   日曜 12:00 → cron: "0  3 * * 0"  (日曜UTC3時)
#   日曜 15:00 → cron: "0  6 * * 0"  (日曜UTC6時)

name: オッズ更新

on:
  schedule:
    - cron: "0 23 * * 5"   # 土曜 8:00 JST
    - cron: "0  3 * * 6"   # 土曜 12:00 JST
    - cron: "0  8 * * 6"   # 土曜 17:00 JST
    - cron: "0 23 * * 6"   # 日曜 8:00 JST
    - cron: "0  3 * * 0"   # 日曜 12:00 JST
    - cron: "0  6 * * 0"   # 日曜 15:00 JST
  workflow_dispatch:         # 手動実行（テスト用）

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update odds
        run: python update_odds.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add DATA/
          git diff --cached --quiet || git commit -m "📊 $(date '+%Y/%m/%d %H:%M') オッズ更新"
          git push
